<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="./style.scss">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="all">
        <aside class="sidebar">
            <div class="cloud">
                <a href="index.html" class="cloud_inf">
                    <svg width="75" height="80" viewBox="0 0 24 24">
                        <path fill="#4a90e2" d="M19 18H6a4 4 0 010-8 5 5 0 019.7-1A3.5 3.5 0 1119 18z"/>
                    </svg>
                </a>
            </div>
            <nav class="menu-list">
                <div class="menu-item home"><img src="/img/home.png" alt="Home"><p>Home</p></div>
                <div class="menu-item"><img src="./img/blog.png" alt="Blogs"><p>Blogs</p></div>
                <div class="menu-item"><img src="img/image-.png" alt="Map"><p>Map</p></div>
                <div class="menu-item"><img src="img/placeholder.png" alt="Photos"><p>Photos</p></div>
                <div class="menu-item"><img src="img/play-button.png" alt="Video"><p>Video</p></div>
                <div class="menu-item"><img src="img/page.png" alt="Pages"><p>Pages</p></div>
                <div class="menu-item"><img src="img/phone.png" alt="Contact"><p>Contact</p></div>
            </nav>
        </aside>

        <main class="main-content">
            
            <header class="TOPmenu">
                <div class="location_name"><p>Rivne, Ukraine</p></div>
                <div class="search">
                 
                    <input type="text" id="weather-input" placeholder="Location name...">
                </div>
                <div class="trash"></div>
            </header>

            <div class="content-body">
                

                <aside class="right_menu">
                    <div class="right_card">
                        <div class="weather_today">
                            <div id="date" class="date">10th</div>
                            <div id="city" class="Name"><p>Rivne</p></div>
                            <div id="Gradusi" class="gradusi"><p>28</p></div>
                            <div id="weather_icon" class="weather"><p>Sunny</p></div>
                            <div  id="wind" class="wind">20s</div>
                            
                            <div class="sunny_img"><img src="./img/sunny.png" alt="Sunny"></div>
                        </div>
                    </div>
                </aside>

            </div> </main>
    </div>

    <script type="module" src="./script.js"></script>
</body>
</html>
